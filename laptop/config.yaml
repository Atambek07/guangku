# Конфигурация робота-плоттера (рукописный конспект + чертежи A4 + управление с телефона)
# Копируйте этот файл в config.yaml и правьте под ваш станок.

serial:
  port: ""              # Beispiel: /dev/ttyUSB0  или  /dev/ttyACM0  (пусто = симуляция без железа)
  baudrate: 115200      # GRBL v1.1 по умолчанию 115200; старые прошивки — 9600 / 57600
  timeout: 2.0          # таймаут чтения ответа от GRBL, сек
  write_timeout: 2.0    # таймаут записи в порт, сек
  max_inflight: 4       # сколько команд можно отослать без подтверждения 'ok'
                        # GRBL имеет кольцевой incoming-буфер (~128 байт v1.1).
                        # Не переполняйте буфер: держите мало незавершённых команд.
  simulate: false       # true — работать без реального COM-порта (режим отладки)

machine:
  steps_per_mm_x: 80.0  # шагов двигателя на 1 мм по X (зависит от ведущего вала/ременя)
  steps_per_mm_y: 80.0  # шагов двигателя на 1 мм по Y
  work_width_mm: 210.0  # ширина рабочей зоны (A4 = 210 мм; по ТЗ 21 см)
  work_height_mm: 300.0 # высота рабочей зоны (по ТЗ 30 см; A4 высота 297 мм)
  origin_corner: top-left   # где ноль (0,0): top-left | bottom-left | top-right | bottom-right
  y_inverted: true          # true — Y растёт вниз по листу (натурально для разметки страницы)
  homing_enabled: true      # поддерживает ли GRBL хoming ($H)
  zero_offset_x: 0.0        # смещение нуля X после G92/G10, мм
  zero_offset_y: 0.0        # смещение нуля Y после G92/G10, мм

pen:
  mode: z                 # z | servo | spindle
                          # z      — ось Z (G1 Z<pos>), типово для ручных плоттеров с сервой на Z
                          # servo  — серво через M3 S<val>/M5 (или M280, если прошивка поддерживает)
                          # spindle— шпиндель GRBL (M3/M5)
  z_down_mm: -1.5         # положение перо «пишет» (касается бумаги), мм relative к нулю Z
  z_up_mm: 3.0            # положение перо «поднято» над бумагой, мм
  z_feed: 600.0           # скорость подъёма/опускания перо, мм/мин
  pen_down_cmd: "G1 Z{z_down} F{z_feed}"   # команда опускания перо (f-строка)
  pen_up_cmd: "G1 Z{z_up} F{z_feed}"       # команда подъёма перо

feed:
  write: 800.0            # скорость написания/черчения (перо опущено), мм/мин
  travel: 2500.0          # скорость перемещения перо поднято (переход между штрахами), мм/мин
  jog: 1500.0             # скорость ручного перемещения осей X/Y, мм/мин
  z: 600.0                # скорость оси Z (подъём/опускание перо), мм/мин

# Веб-сервер
host: 0.0.0.0
port: 8002

# Шрифт по умолчанию и разметка
default_font_size_mm: 8.0
default_line_height_mm: 14.0
default_tracking_mm: 1.0
default_word_spacing_mm: 2.5
default_slant_deg: 0.0
